name: Import full OVERLORD source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-overlord-source.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Clone full source snapshot
        run: git clone --depth 1 https://github.com/BROTEX-DEV/OverLord.git /tmp/overlord-source

      - name: Replace destination working tree with branded source
        run: |
          rsync -a --delete --exclude='.git' /tmp/overlord-source/ ./
          test -f index.html
          test -f package.json
          test -f resources/lang/en.json
          grep -q 'OVERLORD' index.html
          grep -q 'OVERLORD' resources/lang/en.json

      - name: Commit and push imported source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to import."
            exit 0
          fi
          git commit -m "Import full OVERLORD game source"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main
