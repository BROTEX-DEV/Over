name: OVERLORD build check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "packages/**"
      - "resources/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/build-check.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out OVERLORD
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Set up required npm version
        run: npm install --global --ignore-scripts npm@12.1.0
      - name: Install locked dependencies
        run: npm run inst
      - name: Build production client
        run: npm run build-prod
